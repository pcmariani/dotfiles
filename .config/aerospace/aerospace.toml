# Place a copy of this config to ~/.aerospace.toml
# After that, you can edit ~/.aerospace.toml to your liking

# Config version for compatibility and deprecations
# See: https://nikitabobko.github.io/AeroSpace/guide#config-version
# Fallback value (if you omit the key): config-version = 1
config-version = 2

# You can use it to add commands that run after AeroSpace startup.
# Available commands : https://nikitabobko.github.io/AeroSpace/commands
# AeroSpace's PATH is /usr/bin:/bin:/usr/sbin:/sbin and every
# exec-and-forget child inherits it, so Homebrew binaries must be
# called by absolute path here.
after-startup-command = [
  'exec-and-forget /opt/homebrew/bin/borders active_color=0xff00aaff inactive_color=0x00000000 width=4',
  'exec-and-forget ~/.config/aerospace/adaptive-layout.sh'
]

# Start AeroSpace at login
start-at-login = true

# Automatically reload the config when the config file is saved
# After setting this to true, reload once manually to start the auto-reloading
auto-reload-config = true

# Normalizations. See: https://nikitabobko.github.io/AeroSpace/guide#normalization
enable-normalization-flatten-containers = true
enable-normalization-opposite-orientation-for-nested-containers = true

# See: https://nikitabobko.github.io/AeroSpace/guide#layouts
# The 'accordion-padding' specifies the size of accordion padding
# You can set 0 to disable the padding feature
accordion-padding = 10

# Possible values: tiles|accordion
default-root-container-layout = 'tiles'

# Possible values: horizontal|vertical|auto
# 'auto' means: wide monitor (anything wider than high) gets horizontal orientation,
#               tall monitor (anything higher than wide) gets vertical orientation
default-root-container-orientation = 'auto'

# Mouse follows focus when focused monitor changes
# Drop it from your config, if you don't like this behavior
# See https://nikitabobko.github.io/AeroSpace/guide#on-focus-changed-callbacks
# See https://nikitabobko.github.io/AeroSpace/commands#move-mouse
# Fallback value (if you omit the key): on-focused-monitor-changed = []
on-focused-monitor-changed = [
  'exec-and-forget ~/.config/aerospace/adaptive-layout.sh'
]

# You can effectively turn off macOS "Hide application" (cmd-h) feature by toggling this flag
# Useful if you don't use this macOS feature, but accidentally hit cmd-h or cmd-alt-h key
# Also see: https://nikitabobko.github.io/AeroSpace/goodies#disable-hide-app
automatically-unhide-macos-hidden-apps = false

# List of workspaces that should stay alive even when they contain no windows,
# even when they are invisible.
# This config option is only available since 'config-version = 2'
# Fallback value (if you omit the key): persistent-workspaces = []
# Ambient workspaces only. These hold singleton apps that cannot be
# partitioned per project (Slack, Messages) plus unfiled-but-persistent
# browser and AI windows. Project contexts are created on demand by
# `context enter` and are deliberately NOT persistent, so an empty one
# evaporates. Keep this list in sync with `ambient` in
# ~/.config/context/contexts.toml — `context doctor` checks.
persistent-workspaces = ["work", "ai", "browser", "personal"]

# A callback that runs every time binding mode changes
# See: https://nikitabobko.github.io/AeroSpace/guide#binding-modes
# See: https://nikitabobko.github.io/AeroSpace/commands#mode
on-mode-changed = []

on-focus-changed = [
    'exec-and-forget [ $(/opt/homebrew/bin/aerospace list-windows --workspace focused --count) -eq 1 ] && /opt/homebrew/bin/borders width=0 || /opt/homebrew/bin/borders width=4'
]

# Keep the terminal picker's pre-rendered rows in step with reality, and let
# `context record-focus` heal the outgoing context's Chrome snapshot.
#
# THIS IS THE RIGHT HOOK, and it was on `on-focus-changed` until 2026-09-04.
# That one fires on every WINDOW focus change -- alt-tab, a click, an app
# raising itself -- and the rows only go stale when the WORKSPACE moves, so
# picker-refresh.sh grew a mkdir debounce lock and a `picker.rendered-for`
# file purely to work out whether the workspace had actually changed. This
# callback fires only when it has.
#
# It also exports AEROSPACE_PREV_WORKSPACE and AEROSPACE_FOCUSED_WORKSPACE.
# `context record-focus` reads the first, which is authoritative -- it used to
# infer the outgoing workspace from the MRU's head, which assumed the previous
# focus event had not been dropped by the debounce.
#
# Note the shape: this takes a command and its arguments as a LIST, not an
# `exec-and-forget` string like the callback above.
#
# picker-refresh.sh's own rendered-for comparison is now redundant. Leave it
# until the shell side has tests -- it is harmless, and deleting untested
# shell is how the last round of picker bugs reached the user.
exec-on-workspace-change = [
    '/bin/bash', '-c',
    '/Users/petermariani/.config/context/picker-refresh.sh'
]

focus-follows-mouse.enabled = false

# Possible values: (qwerty|dvorak|colemak)
# See https://nikitabobko.github.io/AeroSpace/guide#key-mapping
key-mapping.preset = 'qwerty'

# Gaps between windows (inner-*) and between monitor edges (outer-*).
# Possible values:
# - Constant:     gaps.outer.top = 8
# - Per monitor:  gaps.outer.top = [{ monitor.main = 16 }, { monitor."some-pattern" = 32 }, 24]
#                 In this example, 24 is a default value when there is no match.
#                 Monitor pattern is the same as for 'workspace-to-monitor-force-assignment'.
#                 See:
#                 https://nikitabobko.github.io/AeroSpace/guide#assign-workspaces-to-monitors
gaps.inner.horizontal = 4
gaps.inner.vertical =   4
gaps.outer.left =       4
gaps.outer.bottom =     4
gaps.outer.top =        4
gaps.outer.right =      4

# Ambient workspaces live on the LAPTOP. The external monitor is for whatever
# context you are in, so switching contexts never disturbs Slack, Messages or
# mail. Decided 2026-09-02; see docs/HANDOFF.md in context-based-mac for why a
# context owns one screen rather than spanning both (AeroSpace workspaces
# cannot span monitors at all).
#
# Without this, nothing pinned any workspace to any monitor, so workspaces
# wandered to whichever screen they were last shown on -- and `aerospace
# workspace X` focuses X on the monitor it currently lives on, dragging focus
# across screens. That was the root cause of most multi-monitor friction.
#
# 'built-in' is a case-insensitive regex SUBSTRING of the monitor name, so it
# survives resolution changes and display reordering in a way a 1-based index
# does not. 'main' is the fallback: with the lid closed the built-in display
# does not exist, and a pattern matching no connected monitor is not documented
# behaviour. First matching pattern wins, so on a single screen this whole
# block is a no-op -- there is only one place a workspace can be.
#
# Only these four can be pinned: a force-assignment's left-hand side must be a
# LITERAL workspace name (the regex applies to the monitor pattern), and the
# context workspaces are created on demand, 91 and counting.
[workspace-to-monitor-force-assignment]
work     = ['built-in', 'main']
ai       = ['built-in', 'main']
browser  = ['built-in', 'main']
personal = ['built-in', 'main']

# The context picker is an ephemeral Ghostty window. Tiling it would reshuffle
# the current workspace on every invocation, so float it instead. Matched on
# the --title that bin/context-pick passes to Ghostty.
[[on-window-detected]]
if.app-id = 'com.mitchellh.ghostty'
if.window-title-regex-substring = 'context-picker'
run = 'layout floating'

# 'main' binding mode declaration
# See: https://nikitabobko.github.io/AeroSpace/guide#binding-modes
# 'main' binding mode must be always presented
# Fallback value (if you omit the key): mode.main.binding = {}

# [mode.main.binding]
#
#     # All possible keys:
#     # - Letters.        a, b, c, ..., z
#     # - Numbers.        0, 1, 2, ..., 9
#     # - Keypad numbers. keypad0, keypad1, keypad2, ..., keypad9
#     # - F-keys.         f1, f2, ..., f20
#     # - Special keys.   minus, equal, period, comma, slash, backslash, quote, semicolon,
#     #                   backtick, leftSquareBracket, rightSquareBracket, space, enter, esc,
#     #                   backspace, tab, pageUp, pageDown, home, end, forwardDelete,
#     #                   sectionSign (ISO keyboards only, european keyboards only)
#     # - Keypad special. keypadClear, keypadDecimalMark, keypadDivide, keypadEnter, keypadEqual,
#     #                   keypadMinus, keypadMultiply, keypadPlus
#     # - Arrows.         left, down, up, right
#
#     # All possible modifiers: cmd, alt, ctrl, shift
#
#     # All possible commands: https://nikitabobko.github.io/AeroSpace/commands
#
#     # See: https://nikitabobko.github.io/AeroSpace/commands#exec-and-forget
#     # You can uncomment the following lines to open up terminal with alt + enter shortcut
#     # (like in i3)
#     # alt-enter = '''exec-and-forget osascript -e \
#     # 'tell application "Terminal" to tell (do script) to activate' '''
#
#     # See: https://nikitabobko.github.io/AeroSpace/commands#layout
#     alt-slash = 'layout tiles horizontal vertical'
#     alt-comma = 'layout accordion horizontal vertical'
#
#     # See: https://nikitabobko.github.io/AeroSpace/commands#focus
#     alt-h = 'focus left'
#     alt-j = 'focus down'
#     alt-k = 'focus up'
#     alt-l = 'focus right'
#
#     # See: https://nikitabobko.github.io/AeroSpace/commands#move
#     alt-shift-h = 'move left'
#     alt-shift-j = 'move down'
#     alt-shift-k = 'move up'
#     alt-shift-l = 'move right'
#
#     # See: https://nikitabobko.github.io/AeroSpace/commands#resize
#     alt-minus = 'resize smart -200'
#     alt-equal = 'resize smart +200'
#
#     # See: https://nikitabobko.github.io/AeroSpace/commands#workspace
#     alt-1 = 'workspace 1'  
#     alt-2 = 'workspace 2' 
#     alt-3 = 'workspace 3' 
#     alt-4 = 'workspace 4'  
#     alt-5 = 'workspace 5'
