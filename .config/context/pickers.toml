# ~/.config/context/pickers.toml
#
# A picker is a producer, a consumer and a set of keybind -> verb actions.
# `context pick-command <name>` turns an entry here into the shell pipeline
# the picker loop runs. The loop never reads this file.
#
# NOT in contexts.toml: the pm project plans to read that as its registry, so
# its schema stays frozen.

[[picker]]
name     = "contexts"
# The producer is `cat`, not the CLI: Decision 6 keeps picker.prerendered as
# this producer's cache, written by picker-refresh.sh on every workspace
# change. A producer is a command line and nothing else -- so a producer that
# reads a cache is just a different command line, with no code behind it.
producer = "/bin/cat /Users/petermariani/.local/state/context/picker.prerendered"
consumer = "/Users/petermariani/projects/context-based-mac/bin/context pick-accept contexts"
fields   = "value-tab-display"
multi    = false
# The current context sorts to row 1 (context_records passes
# current_first=True), so the cursor starts on row 2 instead -- otherwise
# hotkey-Enter is a ~1.3s no-op re-enter of where you already are. This
# makes it behave like alt-tab. A bare/path picker (files, folders) has no
# such row and must leave this at the default (1).
cursor_row = 2
action = [
  { bind = "enter", verb = "enter", after = "close", default = true },
]

[[picker]]
name     = "move"
# The SAME producer as `contexts`, deliberately: the destinations for a window
# are exactly the workspaces you can enter, so this needs no second cache and
# no second refresh path. picker-refresh.sh already keeps it current.
producer = "/bin/cat /Users/petermariani/.local/state/context/picker.prerendered"
consumer = "/Users/petermariani/projects/context-based-mac/bin/context pick-accept move"
fields   = "value-tab-display"
multi    = false
# Row 1 is the CURRENT workspace (context_records passes current_first=True),
# and moving a window to where it already is is a no-op -- the same reason
# `contexts` starts on row 2.
cursor_row = 2
action = [
  { bind = "enter", verb = "move", after = "close", default = true },
]

[[picker]]
name     = "files"
# Scoped to the CURRENT workspace's root by resolve_scope, and `fd` respects
# .gitignore -- which is what keeps a client root at ~2,652 records instead of
# 63,346. A rootless workspace correctly gets "nowhere to look".
producer = "/Users/petermariani/projects/context-based-mac/bin/context pick --rows --source files"
# NO action block, and therefore no tool code at all. Actions exist to name a
# VERB for `context pick-accept` to dispatch; this picker pipes the selection
# straight to macOS `open`, which does whatever the file's own default handler
# does. `xargs -0` because fzf --print0 emits the selection NUL-terminated.
consumer = "/usr/bin/xargs -0 /usr/bin/open"
# `bare`: one path per record, no name<TAB>display split. The contexts
# pickers use value-tab-display because they act on a NAME while showing a
# path; here the path IS the value.
fields   = "bare"
multi    = false
# Row 1, the top match. Only the workspace pickers start on row 2, where row 1
# is the workspace you are already in.
cursor_row = 1
