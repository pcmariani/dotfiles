# ~/.config/context/pickers.toml
#
# A picker is a producer, a consumer and a set of keybind -> verb actions.
# `context pick-command <name>` turns an entry here into the shell pipeline
# the picker loop runs. The loop never reads this file.
#
# NOT in contexts.toml: the pm project plans to read that as its registry, so
# its schema stays frozen.

[[picker]]
name     = "workspaces"
# NO `title` here on purpose: BOTH of this entry's doors override it, so a
# default would only ever be shadowed. cmd-esc gets "Workspaces" and
# shift-cmd-esc gets "Move Window to Workspace", written into the fzf flags by
# compose() from paneld.toml's --title. That is the same route --default takes
# and for the same reason -- one picker entry, two doors, and config cannot
# tell them apart, so a per-door value has to come from the door.
# ONE entry for both doors. `contexts` and `move` were identical in producer,
# refresh, refresh_producer, fields, multi, cursor_row and no_input, and
# differed only in which object their verbs acted on (going THERE vs sending
# the window there) -- so as of Task 7 there is one entry with the full 2x2
# of actions below, and the two panels (cmd-esc's `picker`, shift-cmd-esc's
# `move`) differ only in which action Enter aliases via `--default`, written
# into the consumer by compose() (see paneld.toml).
#
# The producer is `cat`, not the CLI: Decision 6 keeps picker.prerendered as
# this producer's cache, written by picker-refresh.sh on every workspace
# change. A producer is a command line and nothing else -- so a producer that
# reads a cache is just a different command line, with no code behind it.
# The join, not `cat`: it reads that same cache and prepends a live
# agent-status cell. The cache itself is unchanged and still knows nothing
# about agents, which is what keeps this removable -- point this back at
# /bin/cat, restart paneld, and the feature is gone.
# --bare at ARM, the full join at REVEAL. The arm-time producer gates
# `load:down`, and so gates the cursor reaching row 2 -- and row 1 here is the
# workspace you are already in, so until it finishes Enter is a no-op. Reported
# 2026-09-10: "I see the picker, then .25-.5s later the selection moves to the
# second row". The join measured 100-210ms at 9 herdr sessions; --bare ~30ms.
# The reveal poke brings the real glyphs in a moment later, into a panel already
# on screen. Columns cannot shift between the two -- emit_bare PADS the status
# cell rather than omitting it, which Spec 7 built in for exactly this.
producer = "/Users/petermariani/projects/context-based-mac/scripts/picker-rows.sh --bare"
# Emits the F12 reload-sync bind that paneld pokes at reveal. NOT --track
# --id-nth: measured 2026-09-10 to make fzf discard keystrokes, Enter and
# Esc included, for the producer's whole duration. See Spec 7 Risk 6.
refresh  = true
refresh_producer = "/Users/petermariani/projects/context-based-mac/scripts/picker-rows.sh"
# --notify so `enter`'s empty-workspace note reaches the screen. The panel
# discards stdout, and main() only notifies a SUCCESS message when asked.
# Costs nothing in the common case: `enter` returns "" when the workspace
# has a window, and main() will not pop an empty string (there is a test);
# `move`'s handler is the same shape (`cmd_move` also returns "" on success),
# so keeping this consumer for both doors costs nothing there either.
consumer = "/Users/petermariani/projects/context-based-mac/bin/context --notify pick-accept workspaces"
fields   = "value-tab-display"
multi    = false
# The current context sorts to row 1 (context_records passes
# current_first=True), so the cursor starts on row 2 instead -- otherwise
# hotkey-Enter is a ~1.3s no-op re-enter of where you already are. This
# makes it behave like alt-tab, and the same reasoning holds for `move`:
# moving a window to where it already is is a no-op. A bare/path picker
# (files, folders) has no such row and must leave this at the default (1).
cursor_row = 2
#
# ctrl- takes YOU somewhere, alt- sends the WINDOW there, and `t` means "a new
# temp workspace" in both halves.
#
# NOTE THE RELEARN, agreed 2026-09-13: --default overrides only Enter, so
# ctrl-t means `room` on BOTH doors. shift-cmd-esc then ctrl-t used to create
# a room and move the window into it; that gesture is alt-t now, and ctrl-t
# there will take you to a new room and leave the window behind.
action = [
  { bind = "enter",  verb = "enter",     after = "close", default = true },
  # CREATE A TEMP WORKSPACE from what you typed and go there. Spec 10.
  #
  # `from_query` means this action receives the QUERY, not the row under the
  # cursor: type a name that matches nothing, press ctrl-t, and you land in
  # a workspace with no directory behind it. It disappears once it holds no
  # windows and is visible on no monitor.
  #
  # ctrl-t and NOT ctrl-n: ctrl-n is fzf's own `down` (fzf.1:2076), and
  # picker_cli.py already refuses it by name for REFRESH_KEY for exactly
  # this reason. Binding it would create a room every time you navigated
  # with it.
  #
  # NOT a "create temp workspace..." ROW, which was the first idea: a
  # selectable row's text enters fzf's own search text, and
  # --tiebreak=begin plus change:first would rank it first the moment you
  # typed a `c` -- the mechanism that once sent Enter into the wrong
  # workspace. compose() emits a --header instead: visible, unselectable,
  # unsearchable.
  #
  # NOT on `switcher`: cmd-tab has no_input = true, so there is no query to
  # create from, and load_pickers refuses that combination outright.
  { bind = "ctrl-t", verb = "room",      after = "close", from_query = true },
  # SEND THE WINDOW there and follow it. Task 1 confirmed 2026-09-13 that
  # Option reaches fzf through paneld's surface -- control (ctrl-r) and test
  # (alt-m) both fired in the same session -- so this is alt-m, not the
  # ctrl-o fallback.
  { bind = "alt-m",  verb = "move",      after = "close" },
  # CREATE A TEMP WORKSPACE and send the window into it, then follow. Backlog
  # 3d. The same key-shape as ctrl-t, so the create gesture keeps its meaning
  # ("new temp workspace") across both halves of the 2x2 -- ctrl- goes there,
  # alt- takes the window there too.
  #
  # A name that already resolves is MOVED TO rather than shadowed, exactly as
  # `room` enters rather than shadows. That is what makes the key safe to
  # press by reflex, which is the whole reason it keeps the same shape.
  { bind = "alt-t",  verb = "move-room", after = "close", from_query = true },
]

[[picker]]
name     = "files"
title    = "Files"
# Scoped to the CURRENT workspace's root by resolve_scope, and `fd` respects
# .gitignore -- which is what keeps a client root at ~2,652 records instead of
# 63,346. A rootless workspace correctly gets "nowhere to look".
producer = "/Users/petermariani/projects/context-based-mac/bin/context pick --rows --source files"
# NO action block, and therefore no tool code at all. Actions exist to name a
# VERB for `context pick-accept` to dispatch; this picker pipes the selection
# straight to macOS `open`, which does whatever the file's own default handler
# does. `xargs -0` because fzf --print0 emits the selection NUL-terminated.
consumer = "/usr/bin/xargs -0 /usr/bin/open"
# `bare`: one path per record, no name<TAB>display split. The contexts
# pickers use value-tab-display because they act on a NAME while showing a
# path; here the path IS the value.
fields   = "bare"
multi    = false
# Row 1, the top match. Only the workspace pickers start on row 2, where row 1
# is the workspace you are already in.
cursor_row = 1

[[picker]]
name     = "config-files"
title    = "Config"
# Fixed scope, so this needs nothing from the tool: `fd` IS the producer. The
# workspace-scoped `files` picker goes through `context pick --rows` only
# because it has to resolve the focused workspace's root first.
#
# ~/.config measured 1,505 files in 26ms. (~ was the tempting alternative:
# 857,374 files and 7.6s.)
producer = "/opt/homebrew/bin/fd --type f -0 . /Users/petermariani/.config"
consumer = "/usr/bin/xargs -0 /usr/bin/open"
fields   = "bare"
multi    = false
cursor_row = 1

# cmd-tab's workspace switcher. IDENTICAL to `contexts` except for the
# producer, and that difference is the whole point.
#
# WHY THIS EXISTS. The switcher used to compose `contexts` directly. Spec 7
# changed that picker's producer from this cached `cat` to the agent-status
# join, and the switcher inherited it. Measured 2026-09-10 at 9 herdr
# sessions: `cat picker.prerendered` ~0ms, `scripts/picker-rows.sh` 100-210ms
# -- and the join's cost SCALES WITH SESSION COUNT, so it degrades as sessions
# accumulate. That is why the problem came and went.
#
# It bites here far harder than on cmd-esc, because of `cursor_row = 2`. That
# emits `load:down+unbind(load)`, which fires on fzf's LOAD event -- i.e. only
# once the producer has finished. cmd-tab's entire premise is landing on row
# 2, so a slow producer means releasing the chord commits row 1, the workspace
# you are already in. It reads as "cmd-tab does nothing", with no error on
# either side.
#
# THE TRADE THIS PARAGRAPH USED TO DESCRIBE IS OVER -- corrected 2026-09-11.
# It said cmd-tab shows the live dot but NOT the status glyphs, "deliberate,
# do not fix it back". The user then asked for the glyphs, and the technical
# objection behind that trade was simply WRONG: it claimed a reveal refresh
# would put a producer between reveal and `load:down`. It does not --
# `load:down` fires on the ARM producer and `unbind(load)` stops the reload
# re-firing it. So the arm/refresh split gives BOTH the fast row-2 landing
# and the glyphs, and that is what this picker now does. See below.
#
# What remains true from the analysis above: the join's cost scales with
# herdr session count, `cursor_row = 2` makes a slow ARM producer commit row
# 1, and baking glyphs into picker.prerendered would make them as stale as
# your last workspace change -- picker-refresh.sh only rewrites that cache on
# a workspace change, which is why the cache alone can never carry live
# status. That last point is why this uses a reveal poke and not a fatter
# cache.
[[picker]]
name     = "switcher"
# AGENT STATUS GLYPHS ON cmd-tab, via the arm/refresh split -- the same
# mechanism cmd-esc uses, which the user endorsed on 2026-09-10: "the list
# populates and the selection is on the 2nd line almost instantly before the
# agent status appear. That's the right tradeoff."
#
# Re-measured 2026-09-11 at 9-10 herdr sessions, and corroborated
# independently by the paneld session. BOTH HANDOFFS QUOTED 100-210ms FOR THE
# JOIN AND THAT IS STALE:
#   cat picker.prerendered  ~0ms
#   picker-rows.sh --bare   10-15ms   <- arm; gates load:down, so it gates
#                                        the cursor reaching row 2
#   picker-rows.sh (join)   70-80ms   <- reveal poke; glyphs land here
#   agent-status.sh alone   40-140ms  <- the herdr fan-out IS the cost,
#                                        and it is noisy; awk is not
#
# WHY THIS DOES NOT REGRESS 50eea1b. `load:down+unbind(load)` fires on the
# ARM producer's load, and the unbind stops the reload-sync's own load from
# re-firing it -- so the cursor reaches row 2 off the 10ms producer, not the
# 70ms one. That unbind is emitted UNCONDITIONALLY by picker_cli.py, for an
# unrelated reason (load re-fires on every reload and BASE_FLAGS carries
# --cycle, so without it the cursor walks a row per refresh, 5/5). The guard
# for this change was already armed before the change existed.
#
# THE HAZARD THAT NEARLY KILLED THIS, and it is measured, not reasoned:
# `--track --id-nth=1` once made fzf discard every keystroke for a reload's
# whole duration, Enter included. On a CYCLING panel the discarded key is the
# COMMIT -- hold the chord, release fast, the poke's reload eats the release's
# Enter, the watchdog dismisses, and cmd-tab silently does nothing, because
# paneld's sendKey returns TRUE when a key is delivered and then thrown away.
# Those flags are deleted, but "the flags were the only cause" was an
# INFERENCE and cmd-esc is not a cycling panel, so that path was untested.
# Measured against real fzf 0.74.3 with a 450ms refresh producer and Enter
# sent 50/150/300ms into the reload: committed on row 2, 4/4, nothing eaten.
# Permanent checks 4 and 5 in scripts/smoke-picker-no-input.sh.
#
# STILL UNTESTED and owned by paneld: sendKey, the watchdog, and the physical
# chord release. The measurement above drives fzf through a pty and does not
# exercise that layer.
# TASK 7: repointed at picker.prerendered.live on BOTH ends, not `contexts`'
# picker.prerendered. `workspaces` now shares one cache with `move`, and
# neither is the ~5-row filtered list this panel's `cursor_row = 2` premise
# depends on -- filtering only the arm would let the reveal poke (which
# always runs, per the unconditional `if picker.refresh:` block at
# picker_cli.py:256-289 -- "the poke refreshes STATUS, not row order")
# repopulate ~5 rows to ~40 with the cursor still pinned at index 2, changing
# the row under the cursor mid-open.
#
# `--bare --live` at arm, `--live` alone (the full join) at reveal -- NOT a
# bare `cat` of the live file at arm, which the mismatch between the two
# would reintroduce: emit_bare pads a 2-char status placeholder onto the raw
# cache row and the join replaces it with a same-width glyph, but a raw `cat`
# has neither, so its row would be two columns narrower than the join's and
# every column would jump the moment the reveal poke lands. `--bare --live`
# keeps that padding while still reading the filtered cache.
producer = "/Users/petermariani/projects/context-based-mac/scripts/picker-rows.sh --bare --live"
refresh  = true
refresh_producer = "/Users/petermariani/projects/context-based-mac/scripts/picker-rows.sh --live"
consumer = "/Users/petermariani/projects/context-based-mac/bin/context --notify pick-accept switcher"
fields   = "value-tab-display"
multi    = false
cursor_row = 2
# No search bar. cmd-tab cycles by muscle memory and never reads rows, let
# alone types at them -- the query line was only ever noise here. cmd-esc
# KEEPS its search bar, which is where you find a workspace by name among ~40.
#
# Verified against real fzf 0.74.3 in a pty, not reasoned about:
# scripts/smoke-picker-no-input.sh asserts Enter still commits onto row 2,
# Esc still aborts with exit 130, and typed text is ignored -- with a control
# proving the harness can commit without the flag. That care is because
# `--track --id-nth=1` once made fzf discard Enter and Esc silently, and
# paneld's sendKey returns TRUE in that failure so nothing logs it.
#
# NOT a side benefit any more -- LOAD-BEARING as of 2026-09-18. With no query
# the ASCII-glyph hazard cannot fire here, and the app-list column appended to
# this surface is ASCII ("Chrome, Slack"). It lands inside field 2, which
# --with-nth=2 makes fzf's own search text, so with a query enabled
# --tiebreak=begin plus change:first could rank a row by its APP NAME and move
# the cursor onto it -- the mechanism that once sent Enter into the wrong
# workspace. See the comment at the append site in scripts/picker-rows.sh.
#
# So this picker also carries NO `title`: cmd-tab is a chord you hold, not a
# page you read a heading on.
#
# REVERT: deleting this line now also requires removing the app column, or
# re-checking that hazard. Then:
#   launchctl kickstart -k "gui/$(id -u)/dev.paneld.paneld"
no_input = true
action = [
  { bind = "enter", verb = "enter", after = "close", default = true },
]
