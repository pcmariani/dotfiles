# ~/.config/context/pickers.toml
#
# A picker is a producer, a consumer and a set of keybind -> verb actions (or,
# for `search`, verb-BY-KIND: a table keyed by the row's kind letter).
# `context pick-command <name>` turns an entry here into the shell pipeline
# the picker loop runs. The loop never reads this file.
#
# NOT in contexts.toml: the pm project plans to read that as its registry, so
# its schema stays frozen.

[[picker]]
name     = "workspaces"
# No panel composes this entry any more (cmd-tab, cmd-esc and opt-esc are
# native cycling panels, and `space-e` is `search` below). It stays because
# `context transfer-step` reads `refresh_producer` from the picker NAMED
# `workspaces` for the downloads panel's workspace list (context/__main__.py,
# the transfer-step branch). The producer is the join of picker-rows.sh;
# `--bare` is its cheap arm-time form.
producer = "/Users/petermariani/projects/context-based-mac/scripts/picker-rows.sh --bare"
refresh  = true
refresh_producer = "/Users/petermariani/projects/context-based-mac/scripts/picker-rows.sh"
consumer = "/Users/petermariani/projects/context-based-mac/bin/context --notify pick-accept workspaces"
fields   = "value-tab-display"
multi    = false
cursor_row = 2
action = [
  { bind = "enter",  verb = "enter",     after = "close", default = true },
]

# THE SEARCH PICKER -- space-e, through `paneld toggle search`. Spec I
# (2026-09-19): one query over three kinds of row -- every workspace (the
# cmd-esc cache's rows, current first, MRU order), then every file under the
# focused context's root, then every installed app. fzf keeps a workspace on
# top for a workspace-shaped query even against a 2,654-file root (spec fact
# 1). Before you type, only workspaces are visible (43 of them, 16 list
# rows): this is a search box, not a browsable list.
#
# kind-display-value: kind<TAB>display<TAB>value, VALUE LAST because a path
# may contain a tab (the display is sanitized so it cannot). Matching is the
# display only (--with-nth alone hides the other fields); the kind letter is
# never search text. File values are ABSOLUTE, so `open-path` needs no root
# at accept -- resolving it there could open a same-named file in a
# workspace switched to since the rows drew.
#
# The verb is a TABLE keyed by kind for Enter. ctrl-t creates a temp workspace
# (a "room") from the typed query, the way it did on the retired workspaces
# panel; alt-m and alt-t (send the window, create-and-send) are gone, the
# mover panels (opt-esc) do that. Each action is ONE LINE: an inline TOML table may not span lines, and a parse
# error here takes EVERY panel's compose down at the next kickstart.
# NOT scoped (that would refuse cursor_row = 2, and nothing here needs the
# root file); refresh = true re-runs the producer at reveal (paneld's f12).
# Re-armed on every workspace change by picker-refresh.sh, LAST in its loop.
[[picker]]
name     = "search"
producer = "/Users/petermariani/projects/context-based-mac/bin/context pick --rows --source search"
refresh  = true
consumer = "/Users/petermariani/projects/context-based-mac/bin/context --notify pick-accept search"
fields   = "kind-display-value"
multi    = false
cursor_row = 2
action = [
  { bind = "enter", verb = { W = "enter", F = "open-path", A = "launch-app" }, after = "close", default = true },
  # Unpin the highlighted workspace's digit (`space-<n>`); never its letter.
  # Workspace rows only -- on a file or app row it says there is nothing to
  # do. Backlog 1c. `reload`: the panel stays open and the list refreshes in
  # place (reload-sync, so the cursor stays put and no partial list shows).
  # The key reaches pick-accept as `--key alt-x`, not in the data -- see
  # compose()'s keep/reload chain. A change here needs `paneld reload search`.
  { bind = "alt-x", verb = { W = "slot-clear" }, after = "reload" },
  # CREATE A TEMP WORKSPACE from what you typed, and go there. Type a name that
  # matches nothing and press ctrl-t; a name that already resolves is entered
  # instead of shadowed, so the key is safe to press by reflex. compose() puts
  # the hint in fzf's footer (not a row: a row's text would enter the search
  # and rank first). Not for a scoped or no_input picker, and never the
  # default. A change here needs `paneld reload search`.
  { bind = "ctrl-t", verb = "room", after = "close", from_query = true },
]

[[picker]]
name     = "downloads"
# N2.2 (2026-10-05). The newest completed downloads, newest first, one row per
# file, and the WHOLE move in this one panel: tab toggles, Enter swaps the list
# IN PLACE -- no second panel -- under a header that names the step:
#   Downloads -> [Choose Workspace, a rootless workspace only] ->
#   Destination Folder . N files -> workspace
# Enter at the last step moves the files into the highlighted folder (`context
# file-move-into`, which refuses any folder outside the workspace and never
# overwrites or creates anything). Nothing moves until then, and Escape at any
# step leaves every file where it was. To send files to a DIFFERENT workspace
# from a rooted one, switch to it first.
#
# `step` is what makes this work: compose() binds Enter and double-click to
# `<step> --fzf-pid $PPID --current={1} -- {+1}` through fzf's `transform`, and
# `context transfer-step` answers with the next fzf actions (see
# context/transfer.py and docs/superpowers/specs/2026-10-04-downloads-single-
# panel-design.md). A step path with a space needs double quotes inside the
# string; this one has none.
#
# `context pick --rows --source downloads` reads ~/Downloads, not the focused
# workspace, so there is no `scoped` and no root file. `refresh` reloads the
# list at reveal (paneld pokes f12) so a download that finished since the last
# arm is in it.
producer = "/Users/petermariani/projects/context-based-mac/bin/context pick --rows --source downloads"
refresh  = true
# --notify so a failure (paneld missing, the staging unwritable) reaches the
# screen: the panel discards stdout.
consumer = "/Users/petermariani/projects/context-based-mac/bin/context --notify pick-accept downloads"
fields   = "value-tab-display"
multi    = true
cursor_row = 1
# ONE LINE: an inline TOML table may not span lines, and a parse error here
# takes every panel's compose down.
step     = "/Users/petermariani/projects/context-based-mac/bin/context transfer-step"
# The default verb runs AFTER the last step's accept, on the highlighted folder.
action = [ { bind = "enter", verb = "file-move-into", after = "close", default = true } ]

[[picker]]
name     = "link-to"
# Link routing, phase 1 (2026-10-23; specs/2026-10-23-link-routing-design.md).
# `context link-send URL` stages a link and toggles this panel; the rows are the
# workspaces that have a Chrome window (none at all unless a link is pending).
# Enter on one commits at once when it has a single kind of window; with both a
# regular and an Incognito window the list swaps in place to those two rows
# (`context link-step`, built like the downloads panel's transfer-step) and the
# second Enter commits `link-commit -- WS:KIND`. Esc leaves the link pending
# until it expires.
#
# `refresh = true` is REQUIRED: without it compose emits no f12 reload bind, and
# a panel armed in the background (with nothing pending, so no rows) and then
# opened by `link-send` would never load them -- paneld pokes f12 at reveal.
# `header` replaces the downloads panel's "Downloads" label. The --notify on the
# consumer is what puts a failure (Chrome down, extension off, no window) on the
# screen: the panel discards stdout.
producer = "/Users/petermariani/projects/context-based-mac/bin/context pick --rows --source link-to"
refresh  = true
consumer = "/Users/petermariani/projects/context-based-mac/bin/context --notify pick-accept link-to"
fields   = "value-tab-display"
multi    = false
cursor_row = 1
# ONE LINE: an inline TOML table may not span lines, and a parse error here
# takes every panel's compose down.
step     = "/Users/petermariani/projects/context-based-mac/bin/context link-step"
header   = "Send link to workspace"
action = [ { bind = "enter", verb = "link-commit", default = true } ]

# THE KEYBINDINGS HELPER -- space-?, through `paneld toggle keybindings` --
# is NOT a picker. Built overnight 2026-09-23 as an fzf-based picker first;
# the user's actual ask, clarified after seeing it, was a static,
# non-interactive, multi-column reference (devhints.io / lazygit's own
# keybindings screen) -- no selection, no search bar, no consumer. See
# context/keybindings_view.py and paneld.toml's `keybindings` panel, whose
# `compose` calls `context render-keybindings-command` directly instead of
# `context pick-command`. Nothing belongs here for it any more.

[[picker]]
name       = "teardown"
# Workspace tear-down (spec 2026-10-19-workspace-teardown). The rows are the
# PLAN for the focused workspace, one per window plus a header; every row's
# value is the workspace name, so Enter on any of them means "tear this
# workspace down". The consumer re-plans from live state and refuses unless the
# workspace is still the focused one; Esc leaves empty stdin, which pick-accept
# treats as a no-op.
producer   = "/Users/petermariani/projects/context-based-mac/bin/context pick --rows --source teardown"
consumer   = "/Users/petermariani/projects/context-based-mac/bin/context --notify pick-accept teardown"
fields     = "value-tab-display"
multi      = false
cursor_row = 1
# A confirm, not a search: nothing to type.
no_input   = true
# ONE LINE: an inline TOML table may not span lines, and a parse error here
# takes every panel's compose down.
action = [ { bind = "enter", verb = "teardown", default = true } ]
