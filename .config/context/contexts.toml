# Context definitions.
#
# A context is a PATH. Entries here decorate paths; [discover] below finds the
# rest; the two merge into one list joined by path, with declared entries
# shadowing discovered ones at the same path. Nothing here is ever written by
# the tool.
#
# path  — the directory. Optional: an entry with only a name is a context with
#         no folder, declarable but never discovered.
# name  — overrides the derived name. Derivation is a bare `basename`,
#         slugified to lowercase ASCII (~/clients/SCS -> scs). A declared entry
#         only gets one derived for free when its `path` is a DIRECT child of
#         a discovery root — `config.py` raises for anything deeper rather than
#         guess, because the name is the join key (AeroSpace workspace, herdr
#         session, Chrome stamp) and a silent rename would orphan running work.
#
#         HISTORY: before the 2026-09-02 root trial this was `parent.basename`,
#         with `.` as the hierarchy separator
#         (~/clients/SCS/jnl-parse-consolidated -> scs.jnl-parse-consolidated),
#         built for depth-2 discovery where two same-named workstreams under
#         different clients had to be told apart. Spec 1 (2026-09-03) deleted
#         it outright: every root now walks exactly one level, so a
#         candidate's parent is always the root and carries no information.
#         There is no code path left that produces the dotted form.
#         The name is the AeroSpace workspace AND the herdr session id, so it is
#         capped at 50 bytes here — macOS limits a unix socket path to 104, and
#         ~/.config/herdr/sessions/<name>/herdr.sock has to fit. The cap is
#         computed from $HOME, so it differs on another machine.
# org   — who the work is for. Display and search only, so free text: real
#         capitalisation and spaces are fine.
#
# Reserved names live in context/model.py (herdr's "default", AeroSpace's
# grammar tokens, the ambient workspace names). `context doctor` additionally
# reads aerospace.toml, so a context colliding with any persistent workspace is
# caught without listing them here.
#
# `dir` still works as a deprecated alias for `path`.


# Picker appearance. `choose` colours exactly two things and there is no
# option for either the panel background or the general text colour — the
# panel follows the system appearance.
#   match_color  the characters you have typed, as they match
#   selection_bg documented as "background color of selected element". That
#                wording is ambiguous — it may mean the highlighted ROW, or
#                only the matched substring's background when -u is set. If
#                changing this has no visible effect, it is the latter, and
#                the row highlight is the system colour and not ours to set.
[picker]
rows          = 18                        # single-line rows, so more fit
width_percent = 55                        # percent of SCREEN width, so it
                                          # differs per display: 40% is 1376px
                                          # on the LG, 576px on the laptop
# Menlo, not Iosevka: it is a system font, always resident, and measured 35ms
# faster to first paint (204ms vs 239ms). choose reloads the font on every
# launch, so a large third-party family is paid for on every keystroke of the
# hotkey. The glyphs we use (● ○) are in both.
font          = "Menlo"
# Drives BOTH backends now. The resident panel's rows are compact, so it wants
# a smaller number than choose did at 24 — raise it if the rows look cramped.
font_size     = 16
match_color   = "00FFFF"                  # cyan, matching your Ghostty cursor
selection_bg  = "000000"                  # see note below

# Resident (Hammerspoon) backend only. It colours ALL text with one colour and
# has no match colour, so match_color above does not reach it — wiring them
# together turned every row cyan, which is what made it ugly.
# One aligned line per row: ● org name path, each column its own colour.
text_color    = "C8D3D5"                  # the name
subtext_color = "5F7377"                  # the path, and the current context
accent_color  = "00FFAA"                  # the ● on a live context
org_color     = "C678DD"                  # the org column
monospace     = true                      # Menlo via styledtext

# Where to look for undeclared contexts. Every direct child of these roots —
# depth 1, and only depth 1 — becomes a pickable context, ranked by directory
# mtime, except:
#   - anything inside a git repo (a repo's subdirectories are its internals)
#   - dotfile directories
#   - the paths listed below
[discover]
# A context is the CLIENT/PROJECT ROOT, not a workstream folder inside it.
# ~/clients/SCS is the context; SCS/settlements is a workstream within it, and
# herdr holds several of those inside one session scoped to `scs`. So both roots
# walk to depth 1 and the two lists are the same shape -- there is nothing left
# for a per-root depth to express.
#
# Trialled 2026-09-02, CONFIRMED PERMANENT 2026-09-03 after a day of use, and
# EXECUTED (Spec 1) 2026-09-03: `max_depth` is deleted in both its forms, the
# code rejects it rather than ignoring it, and the picker's `folders` producer
# (which reaches a root's workstreams again) is designed against depth 1.
# The row count keeps moving as roots and declarations change — see
# `docs/HANDOFF.md` for the current number, not this file.
#
# Reverting would mean re-adding `max_depth` and restoring `exclude_self` to
# the code, not just this config. Recorded as history, NOT as a live option --
# `derive_name`'s `parent.basename` form is not just unreachable, it is DELETED
# from the code (`context/derive.py`); there is nothing left to revert to
# without writing it again.
#
# The old rationale, kept because it explains what depth 2 was FOR: client work
# was modelled as ~/clients/<client>/<project>, which is what produced 92
# contexts (SCS alone had 23). Walking ~/projects deeper than 1 pulled in 32
# rows of project internals (clang/snake, dev-system/docs,
# boomicompanion_plugin/0.2.8), which is why that root was always 1 -- and is
# also why the projects side needed no change here: it was already root-shaped.
roots = [
  "~/projects",
  "~/clients",
  # A container exactly like ~/clients: it holds projects rather than being
  # one, and is not a git repo. Its B_H is declared below, because
  # ~/clients/B_H derives the same `b-h` and a derived-name collision blocks
  # entering either.
  "~/projects/boomi-projects",
]

# exclude = drops a path AND everything under it.
#
# `exclude_self` (drop a directory, keep its children) existed ONLY to say
# that ~/clients/SCS and ~/clients/SportsBasement were containers rather than
# places work happens. At depth 1 those ARE the contexts and their children
# are not, so the setting inverted -- what it dropped is now exactly what is
# wanted. Spec 1 (2026-09-03) deleted its parsing and its tests along with
# `max_depth`, not just this config: there is nothing left in the code to
# revert to without writing it again.

[[context]]
name = "apollo"
org  = "Apollo"
path = "~/clients/Apollo"

# WORKSTREAM entries, kept deliberately through the root trial.
#
# Both point INSIDE a client root, which is exactly the conflation the trial
# exists to remove -- so they were briefly deleted on 2026-09-02 and restored
# the same day, for a reason worth recording.
#
# Removing them did not just hide two picker rows. The name is the join key, so
# `context enter scs-jnl-parse` stopped resolving while the herdr session of
# that name kept running with a live Claude session inside it. Entering the new
# `scs` root created a SECOND, empty session and opened a terminal at the
# 23-folder junk drawer, which read as "my work is gone". It was not gone; it
# was in a session that no longer had a route in. (`herdr --session <name>`
# still reaches one directly, which is how they came back.)
#
# So the rule the trial taught: a context may be retired once its work is
# genuinely idle, never while a session is live.
#
# RETIRED 2026-09-03: `sb-sales-analysis` and `scs.claude` are gone, in the
# right order -- both herdr sessions were stopped FIRST, then these blocks
# removed, so neither was ever an orphan. Every context name now equals its
# herdr session name, both derived from the client root. `scs-jnl-parse`
# remains because it is still declared work.
#
# Retiring them leaves two large Claude memory stores unowned, since those are
# keyed by working directory: SportsBasement/sales-test-anlysis has 77 files
# and SCS/claude has 23, against roots holding 0 and 1. Entering the root now
# gets the cold store, and doctor's memory-store check reports exactly this
# until those stores go quiet.
[[context]]
name = "scs-jnl-parse"
org  = "SCS"
path = "~/clients/SCS/jnl-parse-consolidated"

# No org: this is personal tooling, not client work.

# No org: this is personal tooling, not client work.
[[context]]
name = "context-based-mac"
path = "~/projects/context-based-mac"

# Declared to break a derived-name collision, not because it needs decoration.
# ~/clients/B_H and ~/projects/boomi-projects/B_H both derive `b-h`, and
# `merge` drops a discovered candidate whose path is already declared -- so
# naming this one takes it out of derivation entirely and leaves `b-h` to the
# client folder. Verified live 2026-09-03: 34 contexts, zero collisions -- see
# docs/HANDOFF.md for why the plan's own 36-context estimate ran high (it
# predates the same-day retirement of two holdover workstreams).
[[context]]
name = "boomi-b-h"
path = "~/projects/boomi-projects/B_H"


# Apps `context open <app> [name]` can launch with a context's directory as
# the scope. Moved here from SCOPED_APPS in context/opener.py on 2026-09-02,
# once a second scoping MECHANISM had shown what actually varies. Adding an
# app now needs no Python.
#
# There is no universal "launch it in this directory". macOS apps fall into
# four groups, and only the first two are expressible here:
#
#   1. inherit the spawn cwd        -- neovide, nvim
#   2. take the path as an ARGUMENT -- `code <dir>` opens it as a workspace
#   3. `open -a App <path>`         -- the generic document route
#   4. no path affordance at all    -- Chrome, which is why context models
#                                      Chrome WINDOW OWNERSHIP instead
#
# name       typed as the argument to `context open`. A plain lowercase token.
# argv       the command. Absolute, always: a hotkey gets
#            PATH=/usr/bin:/bin:/usr/sbin:/sbin, where a bare command name
#            resolves to nothing. Never templated.
# path_args  arguments carrying the scope, with `{path}` substituted at launch.
#            For a group-2 app this IS the mechanism; for group 1 it is a
#            workaround for the app's own cwd handling.
# app_name   what AeroSpace calls the app's windows, so the new window can be
#            moved into the context's workspace. The app NAME, not a bundle
#            id -- a binary launched outside an .app bundle reports
#            NULL-APP-BUNDLE-ID, so bundle-id matching finds nothing. Omit it
#            and `open` scopes the directory but leaves placement alone.

# Group 1, and the worked example of why the spawn cwd is NOT enough: neovide
# starts the editor via `login -fpq <user> /bin/zsh -c exec nvim --embed`, and
# a LOGIN shell resets cwd to $HOME. Measured 2026-09-02 -- with only the spawn
# cwd set, neovide reported the project root while its embedded nvim reported
# /Users/petermariani. `-- +cd <path>` survives it. Launching from a terminal
# HIDES this (neovide then execs nvim directly, no login wrapper), so an
# interactive test passes while the hotkey path silently opens in $HOME.
# Check the CHILD: `lsof -a -d cwd -p <nvim pid>`.
#
# A bare path here would make nvim OPEN the directory rather than chdir to it.
# Note `--new-window` is not standalone for neovide: it needs --reuse-instance.
[[app]]
name      = "neovide"
argv      = ["/opt/homebrew/bin/neovide"]
path_args = ["--", "+cd {path}"]
app_name  = "neovide"

# Group 2, and the reason this table is data rather than a switch. VSCode does
# not care about the working directory at all: the folder argument IS the
# scope. Its `--new-window` IS standalone, unlike neovide's -- exactly the kind
# of per-app spelling that cannot be abstracted away.
#
# The CLI lives inside the bundle and is not on PATH, which is moot here since
# every argv[0] is absolute anyway. AeroSpace calls these windows `Code`, not
# "Visual Studio Code". A cold launch can open THREE windows (a Preview tab,
# Release Notes, and the project window), which is why `open` moves every new
# window it sees rather than picking one.
[[app]]
name      = "code"
argv      = ["/Applications/Visual Studio Code.app/Contents/Resources/app/bin/code"]
path_args = ["--new-window", "{path}"]
app_name  = "Code"
