# Context definitions.
#
# A context is a PATH. Entries here decorate paths; [discover] below finds the
# rest; the two merge into one list joined by path, with declared entries
# shadowing discovered ones at the same path. Nothing here is ever written by
# the tool.
#
# path  — the directory. Optional: an entry with only a name is a context with
#         no folder, declarable but never discovered.
# name  — overrides the derived name. Derivation is `parent.basename`,
#         slugified to lowercase ASCII with `.` as the hierarchy separator:
#           ~/clients/SCS/jnl-parse-consolidated -> scs.jnl-parse-consolidated
#         falling back to `basename` alone when that would exceed the byte cap.
#         The name is the AeroSpace workspace AND the herdr session id, so it is
#         capped at 50 bytes here — macOS limits a unix socket path to 104, and
#         ~/.config/herdr/sessions/<name>/herdr.sock has to fit. The cap is
#         computed from $HOME, so it differs on another machine.
# org   — who the work is for. Display and search only, so free text: real
#         capitalisation and spaces are fine.
#
# Reserved names live in context/model.py (herdr's "default", AeroSpace's
# grammar tokens, the ambient workspace names). `context doctor` additionally
# reads aerospace.toml, so a context colliding with any persistent workspace is
# caught without listing them here.
#
# `dir` still works as a deprecated alias for `path`.


# Picker appearance. `choose` colours exactly two things and there is no
# option for either the panel background or the general text colour — the
# panel follows the system appearance.
#   match_color  the characters you have typed, as they match
#   selection_bg documented as "background color of selected element". That
#                wording is ambiguous — it may mean the highlighted ROW, or
#                only the matched substring's background when -u is set. If
#                changing this has no visible effect, it is the latter, and
#                the row highlight is the system colour and not ours to set.
[picker]
rows          = 18                        # single-line rows, so more fit
width_percent = 55                        # percent of SCREEN width, so it
                                          # differs per display: 40% is 1376px
                                          # on the LG, 576px on the laptop
# Menlo, not Iosevka: it is a system font, always resident, and measured 35ms
# faster to first paint (204ms vs 239ms). choose reloads the font on every
# launch, so a large third-party family is paid for on every keystroke of the
# hotkey. The glyphs we use (● ○) are in both.
font          = "Menlo"
# Drives BOTH backends now. The resident panel's rows are compact, so it wants
# a smaller number than choose did at 24 — raise it if the rows look cramped.
font_size     = 16
match_color   = "00FFFF"                  # cyan, matching your Ghostty cursor
selection_bg  = "000000"                  # see note below

# Resident (Hammerspoon) backend only. It colours ALL text with one colour and
# has no match colour, so match_color above does not reach it — wiring them
# together turned every row cyan, which is what made it ugly.
# One aligned line per row: ● org name path, each column its own colour.
text_color    = "C8D3D5"                  # the name
subtext_color = "5F7377"                  # the path, and the current context
accent_color  = "00FFAA"                  # the ● on a live context
org_color     = "C678DD"                  # the org column
monospace     = true                      # Menlo via styledtext

# Where to look for undeclared contexts. Everything under these roots at depth
# 1-2 becomes a pickable context, ranked by directory mtime, except:
#   - anything inside a git repo (a repo's subdirectories are its internals)
#   - dotfile directories
#   - the paths listed below
[discover]
# Depth is per root, because the two have different shapes. A project lives at
# ~/projects/<project>, so depth 1; walking deeper pulled in 32 rows that were
# project internals (clang/snake, dev-system/docs, boomicompanion_plugin/0.2.8).
# Client work lives at ~/clients/<client>/<project>, so depth 2.
roots = [
  { path = "~/projects", max_depth = 1 },
  { path = "~/clients",  max_depth = 2 },
]
max_depth = 2       # default for any root that does not set its own

# exclude      = drops a path AND everything under it
# exclude_self = drops only the named directory, keeping its children.
# These two client folders are containers, not places work happens — entering
# one gives a terminal at a directory of 50-115 unrelated project folders — but
# their children are real contexts, so they cannot simply be excluded.
exclude_self = ["~/clients/SCS", "~/clients/SportsBasement"]

[[context]]
name = "apollo"
org  = "Apollo"
path = "~/clients/Apollo"

[[context]]
name = "scs-jnl-parse"
org  = "SCS"
path = "~/clients/SCS/jnl-parse-consolidated"

[[context]]
name = "sb-sales-analysis"
org  = "Sports Basement"
# Directory name is misspelled upstream ("anlysis"); the context is not.
path = "~/clients/SportsBasement/sales-test-anlysis"

# No org: this is personal tooling, not client work.
[[context]]
name = "context-based-mac"
path = "~/projects/context-based-mac"

# Collision override. Both ~/clients/plexus and ~/projects/plexus derive
# "plexus" — each is a direct child of a root, so parent.basename gives no
# qualifier. Naming one after its root breaks the tie; entering either is
# blocked until this exists. (Both are stale scratch dirs; excluding them
# under [discover] would work equally well.)
[[context]]
name = "projects.plexus"
path = "~/projects/plexus"
