# paneld. One panel per [[panel]] block.
#
# THE `picker` PANEL IS RETIRED, 2026-09-26 (the user's own request, folding
# cmd-tab/cmd-esc/cmd-backtick into one modifier family: workspace/window/
# chrome-tab). It toggled the `workspaces` list (Enter = enter) on cmd-esc,
# which that key now reaches `windows` through instead -- see the "workspace
# switcher" rule block in karabiner.edn for the Carbon-registration note that
# used to live here. The `workspaces` picker itself is not gone: the
# search/"everything" picker (space-e) already covers workspaces, and `move`
# below still composes the same picker with `--default move`.
[[panel]]
name    = "move"
# opt-esc as of 2026-09-28 (the user's own request: cmd is the switch
# modifier -- cmd-tab/cmd-esc/cmd-backtick -- and opt is the move one, so
# `move` gets opt-esc, right next to `windows`' cmd-esc). Registered
# DIRECTLY BY PANELD, no karabiner rewrite needed: plain Escape-based
# chords already reach Carbon's RegisterEventHotKey cleanly without one
# (the same reason cmd-esc/shift-cmd-esc below need no rewrite either) --
# confirmed by reading Hotkey.swift's own modifier/key parsing, not
# assumed. option-cmd-backtick's own karabiner.edn rewrite rule
# (cmd-opt-f15) is left in place, unused, matching this project's own
# established precedent of not deleting a working rewrite just because
# nothing currently consumes it (see this file's own history: the
# cmd-opt-shift-f15 rewrite from `move`'s PREVIOUS hotkey, shift-cmd-esc,
# is still sitting there unused too).
hotkey  = "opt-esc"
# TASK 7: composes the same `workspaces` picker the now-retired `picker`
# panel used to (see the note at the top of this file), with `--default
# move` so this door's Enter means `move` instead of `enter` -- compose()
# writes that override into the consumer (picker_cli.py), and it overrides
# ONLY the default (Enter) key. ctrl-t still means `room` here, not
# `move-room` -- the relearn agreed 2026-09-13, see pickers.toml.
compose = "context pick-command workspaces --default move --title 'Move Window to Workspace' --socket /Users/petermariani/.local/state/context/move.sock"
width   = 912
height  = 420
# PINNED TO THE LG, 2026-09-16 (same mechanism the retired `picker` panel
# used, and `switcher` below still uses): without this the panel follows
# keyboard focus (PanelController.swift:107 falls back to NSScreen.main).
screen  = "LG HDR WQHD"
arm     = true

# At reveal, paneld presses F12 in this panel's live pty. compose() binds F12 to
# `reload-sync(picker-rows.sh)`, so the agent-status cell refreshes ~200ms into
# the open -- while you are already reading -- and the keypress itself still
# only reveals a pre-drawn surface.
#
# F12 and not ctrl-n: ctrl-n is one of fzf's own defaults for `down`. f12
# resolves to macOS keycode 0x6F in libghostty's pinned table, so sendKey will
# not take its silent false path.
#
# IDEMPOTENT POKES ONLY. A late press lands in whatever pty is live when it
# arrives, so nothing with side effects may ever be bound here -- no verb, no
# execute-silent, nothing that writes. A reload is safe because running it
# twice is harmless.
on_reveal_key = "f12"
[[panel]]
name    = "files"
# Summoned by space-shift-f, which Karabiner routes to `paneld toggle files`
# over the control socket -- a space-mode layer cannot hand Carbon a chord it
# did not receive itself.
#
# So this hotkey is NEVER PRESSED, and it is set explicitly because the field
# defaults to `f18` when omitted -- and karabiner.edn's retired "context
# picker" rule used f18, so inheriting that default would re-grab a key with
# history. hyper-f20 needs all four modifiers plus a key most keyboards do not
# have.
hotkey  = "hyper-f20"
compose = "context pick-command files"
width   = 912
height  = 420
# PINNED TO THE LG, 2026-09-28 -- the user's own request: every panel
# should appear in the same fixed place, not just the three that
# originally declared this (move, switcher, and formerly the retired
# `picker`). This one had no documented reason to be unpinned; it simply
# never got the line. Same mechanism as `move`'s own `screen` comment.
screen  = "LG HDR WQHD"
# ARMED, like every other panel, since 2026-09-19 (Spec E amendment). This
# was `arm = false` from 2026-09-09 to 2026-09-18 on the argument that the
# rows depend on which workspace is focused and rearming on every workspace
# change would "run fd over a client root constantly". Measured 2026-09-19:
# the whole producer (Python + fd) is 123ms, fd alone 17ms, and
# picker-refresh.sh already runs a 150-330ms herdr fan-out on every workspace
# change -- while the arm-at-reveal path cost a surface build plus the 400ms
# settle timer before that 123ms even started, which the user called slow.
#
# So: armed here, re-armed by picker-refresh.sh on every workspace change (its
# rearm loop names `files`), and RELOADED at reveal through on_reveal_key
# below, so a file created since the last workspace change is in the list.
# paneld defers a rearm while the panel is visible or a verb is running
# (PanelStateMachine.rearmRequested), so a workspace change while this is
# open rebuilds at dismiss, never under the user -- same as `picker`.
#
# A rootless workspace: the producer emits nothing and removes its root file
# (no banner from a background arm); the KEYPRESS, scripts/reveal-files.sh,
# banners and keeps the panel closed. `arm` is read at construction, so a
# change here needs a kickstart, not `paneld reload`.
arm     = true
# The same reload-at-reveal `picker` and `move` use: the daemon sends this key
# when the panel is shown, compose() binds it to reload-sync of the producer.
# Nothing with side effects may be bound here; a reload is safe because
# running it twice is harmless.
on_reveal_key = "f12"

[[panel]]
name    = "config-files"
# Summoned by space-shift-c via `paneld toggle`, like the files picker -- so
# this hotkey is never pressed and is set explicitly only to avoid the f18
# default. See the files panel above.
hotkey  = "hyper-f19"
compose = "context pick-command config-files"
width   = 912
height  = 420
# PINNED TO THE LG, 2026-09-28 -- see the `files` panel's own comment
# above; same reasoning, same oversight, same fix.
screen  = "LG HDR WQHD"
arm     = true

[[panel]]
name    = "apps"
# Launch an installed application (Spec H, the sibling's
# docs/superpowers/specs/2026-09-19-applications-picker-design.md). Summoned
# by space-shift-a via `paneld toggle apps`, like files and config-files -- so
# this hotkey is never pressed and is set explicitly only to avoid the f18
# default. See the files panel above.
hotkey  = "hyper-f17"
# A bare `context`, like every compose line here. It is resolved ONCE, by
# /bin/sh under the LaunchAgent's PATH (~/.local/bin first; the plist is
# written by paneld's script/install.sh), at daemon boot and on `paneld reload
# apps`. The pipeline it emits is absolute (app-rows.sh | fzf | xargs open -a),
# so the reveal never searches PATH.
compose = "context pick-command apps"
width   = 912
height  = 420
# PINNED TO THE LG, 2026-09-28 -- REVERSES the note this comment used to
# make ("not pinned, unlike the three workspace panels"). The user's own
# explicit call: every panel appears in the same fixed place, full stop,
# not just the ones whose rows happen to be workspace-independent. Armed
# like the rest, and re-armed on every dismissal by the state machine --
# but NOT by picker-refresh.sh on workspace change, because the rows do
# not depend on the workspace. `arm` is read at construction, so a change
# here needs a kickstart.
screen  = "LG HDR WQHD"
arm     = true
# The same reload-at-reveal the other pickers use: the daemon sends f12 when
# the panel is shown, compose() binds it to reload-sync of the 20ms producer.
# Nothing with side effects may be bound here; running a reload twice is
# harmless.
on_reveal_key = "f12"

[[panel]]
name    = "search"
# One list of workspaces, files and apps, dispatched by row kind (Spec I, the
# sibling's docs/superpowers/specs/2026-09-19-unified-search-picker-design.md).
# Summoned by space-e via `paneld toggle search`, like the pickers above -- so
# this hotkey is never pressed and is set explicitly only to avoid the f18
# default. See the files panel.
hotkey  = "hyper-f16"
# A bare `context`, like the other six: resolved once by /bin/sh under the
# LaunchAgent's PATH at boot and on `paneld reload search`; the emitted
# pipeline is absolute (context pick --rows | fzf | context pick-accept).
compose = "context pick-command search"
width   = 912
height  = 420
# PINNED TO THE LG, 2026-09-28 -- REVERSES this comment's own former note
# ("unpinned, like files, config-files and apps"), per the user's explicit
# request to pin every panel, not just the workspace-independent ones.
# Armed like the rest, and re-armed on every workspace change by
# picker-refresh.sh, LAST in its rearm loop, because both its workspace
# rows and its file rows follow the focused workspace. `arm` is read at
# construction, so a change here needs a kickstart.
screen  = "LG HDR WQHD"
arm     = true
# The same reload-at-reveal the other pickers use: the daemon sends f12 when
# the panel is shown, compose() binds it to reload-sync of the ~150ms
# producer, so the list is current at reveal even between workspace changes.
# Nothing with side effects may be bound here; running a reload twice is
# harmless.
on_reveal_key = "f12"

[[panel]]
name    = "switcher"
# cmd-tab, taken from the Dock by karabiner.edn and rewritten to cmd-f18.
# The `to` binding KEEPS cmd deliberately: release-to-commit depends on the
# modifier still being physically down and visible to a local NSEvent
# monitor. A bare f18 would drop it and the panel would never commit.
#
# CHANGING A HOTKEY NEEDS A DAEMON RESTART, not `paneld reload` -- and note
# that `cycle` now has the same requirement for a different reason: the
# hotkey's branch reads the controller's live config, but the CHORD itself is
# registered once at startup.
hotkey         = "cmd-f18"
hotkey_reverse = "cmd-shift-f18"
cycle          = true
# The TODO that was here is DONE and its premise was also wrong. Corrected
# 2026-09-11 by the context-based-mac session, which owns this producer.
#
# `switcher` is NOT a shorter list -- it is the same ~40 workspaces `contexts`
# shows, same rows. What it buys is producer LATENCY, not a smaller list. Do
# not "fix" this comment by claiming switcher is the right, shorter list; that
# is a new wrong fact. A genuinely shorter cycling list is UNBUILT and belongs
# to context-based-mac.
#
# TWICE-CORRECTED, same day, and both errors are worth seeing. This comment
# said the producer is `cat picker.prerendered` and cost "~0ms against
# 100-210ms at nine herdr sessions". Both are now wrong:
#   - The producer is `picker-rows.sh --bare` since the glyph work below
#     landed, and the prerendered cache is no longer on the switcher's path.
#   - 100-210ms was STALE. Re-measured at 9-10 sessions by both sessions
#     independently: `--bare` ~10-15ms, the full join ~70-80ms.
# The stale figure survived here for an hour while the block 30 lines down
# correctly called it stale -- one file disagreeing with itself, which is what
# a number with no date attached buys you. The sibling session caught it.
compose        = "context pick-command switcher --socket /Users/petermariani/.local/state/context/switcher.sock"

# AGENT STATUS GLYPHS, via the arm/refresh split. Added 2026-09-11 at the
# user's explicit request -- "I'd really like to have that" -- REVERSING a
# prohibition this file carried for about an hour. The prohibition's reasoning
# is kept below because it is the thing most likely to be re-derived and
# re-applied by someone reading only the first half of it.
#
# WHAT WAS WRONG: that an on-reveal reload-sync puts a producer back between
# reveal and `load:down`, re-breaking the row-1 commit bug. It does not.
# `load:down+unbind(load)` fires on the ARM-TIME producer's load, and the
# `unbind(load)` half means no later reload's load event can re-fire it.
# Verified here rather than taken on faith: that bind is already present in
# this panel's composed flags today, and `picker_cli.py:158` emits it
# UNCONDITIONALLY and says why -- `load` re-fires on every reload and
# BASE_FLAGS carries `--cycle`, so without the unbind the cursor walks a row on
# every refresh (measured 5/5). The guard for exactly this change was
# deliberately armed in advance.
#
# WHAT STILL STANDS, and is a different argument: a glyph BAKED into
# picker.prerendered would be stale, because picker-refresh.sh rewrites that
# cache only on a workspace change -- so it would be as old as your last
# switch. That rules out baking the column into the arm-time producer. It says
# nothing against refreshing on reveal, which is what this does.
#
# THE NUMBERS, re-measured 2026-09-11 at 10 herdr sessions. The
# 100-210ms this file used to quote is STALE:
#   cat picker.prerendered   ~0ms
#   picker-rows.sh --bare    ~10-15ms   <- arms fast enough to reach row 2
#   picker-rows.sh full      ~70-80ms   <- arrives into a panel already up
# `--bare` PADS the status cell, so there is no column shift when the full
# join replaces it. Spec 7 built that in and verified it byte-for-byte.
#
# INERT UNTIL THE SIBLING'S HALF LANDS. This needs `refresh = true` and
# `refresh_producer` on `switcher` in ~/.config/context/pickers.toml. Until
# then f12 is unbound in the composed command and this poke is a harmless
# no-op -- which is why this side goes first.
#
# THE KEYSTROKE HAZARD: fzf's half is MEASURED CLEAR, paneld's half is NOT.
# Keep that split straight, because the two layers fail differently.
#
# The hazard is this panel's own documented one -- a client can discard the
# keys paneld presses, and on a CYCLING panel a discarded keystroke can be the
# COMMIT. Hold the chord, release quickly, the reload eats the release's Enter,
# the watchdog dismisses, and cmd-tab silently does nothing while `sendKey`
# returns TRUE, so nothing in paneld.log can see it.
#
# MEASURED AND CLEAR (sibling session 2026-09-11, real fzf 0.74.3 in a pty, a
# deliberately slow 450ms refresh producer, Enter sent INTO the reload at 50ms,
# 150ms, 300ms and a 900ms control): committed on row 2, 4/4, nothing eaten. So
# without `--track --id-nth=1` a `reload-sync` does not discard the commit --
# which was an INFERENCE before that run and is now a measurement. Also
# asserted: `--no-input` does not break a f12 bind. Both are permanent checks 4
# and 5 in the sibling's `scripts/smoke-picker-no-input.sh`.
#
# PANELD'S HALF IS NOW MEASURED TOO, by the only instrument that could reach
# it: the user's hand. Confirmed 2026-09-11 -- "glyphs show up and enter
# works", on a real hold-then-release of the chord. So `sendKey`, the commit
# watchdog and the physical chord release are all clear for ENTER on this path,
# not just fzf's pty-level behaviour. The hazard flagged here is discharged.
#
# ONE THING NEVER EXPLICITLY CONFIRMED: **Esc dismissing** during a refresh.
# fzf's half is asserted in the sibling's smoke check 2; paneld's half is
# untested. Low risk now that Enter is known not to be eaten -- both travel
# the same `sendKey` path -- but it is untested, not verified.
# If cmd-tab ever "does nothing" intermittently, remove this line first.
on_reveal_key = "f12"
width          = 925
height         = 420
# 16 -> 18, the user's own ask ("increase the font of the switcher by 2
# points"), switcher-only. Needs a daemon restart to take effect, not
# `paneld reload switcher` -- see the `windows` panel's comment on
# reveal_delay_ms for the same distinction (font_size/inset/line_height
# vs. everything read live off the config).
font_size      = 18
# Same pin as `move` -- see its comment for the mechanism. cmd-tab is the one
# pressed most by reflex and least by reading, so a fixed location matters
# more here than anywhere else.
screen         = "LG HDR WQHD"
arm            = true

# The window switcher -- option-cmd-backtick holds and cycles the FOCUSED
# workspace's windows in MRU order, release focuses the pick. The sibling's
# Spec L; its producer is `context pick --rows --source windows`.
#
# NOT PINNED, and that is the whole point of the panel. The three workspace
# panels above pin to the LG because a reflex chord wants a fixed location.
# This one lists the windows of the workspace you are LOOKING at, so it has
# to appear where you are looking -- an unpinned panel lays out on
# NSScreen.main, which is that screen. D11 of the spec said pinned; it was
# reversed on that argument.
#
# cmd-esc/shift-cmd-esc as of 2026-09-26 (the user's own request: cmd-tab,
# cmd-esc, cmd-backtick as workspace/window/chrome-tab, one modifier
# family) -- off option-cmd-backtick, which now opens `move` instead (see
# that panel, and karabiner.edn's "workspace switcher" rule block).
# REGISTERED DIRECTLY BY PANELD, no karabiner rewrite: plain Escape already
# reaches Carbon's RegisterEventHotKey cleanly without one (the retired
# `picker` panel and `move` proved this for a plain toggle, cmd-esc/
# shift-cmd-esc, since 2026-09-09). NOT YET CONFIRMED for THIS panel's own
# cycle gesture specifically -- repeated taps of a directly-registered
# chord while held has not been tested with a real key press (wired up
# while the screen was locked). If hammering cmd-esc does not step through
# windows, add a cmd-esc -> cmd-fNN rewrite to karabiner.edn, the same
# pattern `chrome-tabs` below uses, and point this hotkey at that F-key.
#
# Release-to-commit is keyed on COMMAND ONLY -- option is never consulted, so
# a thumb slipping off option does not commit, and cmd-up commits regardless.
#
# `arm = true` IS REQUIRED HERE, and not merely conventional. A cycle chord's
# steps are sent per keypress by `sendCycleKey`, not at reveal. With
# `arm = false` `settle()` tears the surface down while hidden
# (`holdsSurfaceWhileHidden`), so the first presses would be typed into an fzf
# that is still spawning -- ~155-173ms warm, longer than the reveal delay and
# squarely inside a hammering cadence. `sendKey` returns TRUE when the client
# discards a keystroke, so it would fail SILENTLY and present as "hammering
# does nothing sometimes". The FIRST chord sends no step, so the producer
# opens with the cursor already on row 2 (`load:down+unbind(load)`).
#
# NO `on_reveal_key`, DELIBERATELY -- the only panel without one. The reveal
# key fires a reload whose bind forces the cursor back to row 2, so every
# chord step taken inside the reveal delay was discarded when the reveal
# landed: hammer four times and you land on row 2, not row 4. The user asked
# to be able to hammer this. The sibling dropped the panel's `refresh` to
# match, so nothing stomps the cursor. COST: a window opened in the workspace
# you are already sitting in is not listed until the next rearm. Theirs to
# reverse.
#
# WIDTH 300, NOT 912 -- the user wanted one column and no more. The rows are
# APP NAME ONLY (no window title), budget 20 content + ~4 fzf chrome = 24
# columns. 300 gives 28 columns on the LG and **29 on the Retina, MEASURED**
# (`grid 29x16 cells in 576x832px`). 260 was proposed and rejected: it lands
# on EXACTLY 24 on the LG, which is the switcher's 85-of-85 zero-spare
# condition in a new place. This panel is unpinned and can open on either
# screen, so THE LG GOVERNS -- never size for the Retina.
#
# HOW TO DERIVE A NEW WIDTH, because two models have already been wrong here.
# NEVER divide by the cell size in the log: it is rounded to whole pixels and
# the division disagrees with itself (94 cols in 1800px and 95 in 1824px
# cannot both hold at 19px). A first bracket that fixed that still predicted
# 30 on the Retina and measured 29, because it omitted libghostty's
# HORIZONTAL padding. The model that fits all four live observations
# (900pt/2x=94, 912pt/2x=95, 288pt/2x=29, 900pt/1x=89) is
# `cols = floor((width - 2*inset - 2*padding_x) * scale / cell)` with
# padding_x 1-3pt, cell (18.93, 19.11]px at 2x and (9.93, 10.09]px at 1x.
# Every padding value in that range agrees on the answers, so they are safe:
# **260 -> LG 24 / Retina 25 · 280 -> 26 / 27 · 300 -> 28 / 29 · 320 -> 30 /
# 31.** The LG column is the one that matters. Confirm by reading the grid
# line after a kickstart rather than trusting any of this.
#
# `height` stays a FLOOR: the producer emits `paneld:rows:N` and the window
# sizes down to the list.
[[panel]]
name           = "windows"
hotkey         = "cmd-esc"
hotkey_reverse = "shift-cmd-esc"
cycle          = true
compose        = "context pick-command windows"
arm            = true
width          = 300
height         = 420
# PINNED TO THE LG, 2026-09-28 -- the user's own explicit override of this
# panel's original design (it used to deliberately follow keyboard focus,
# "it lists the windows of the workspace you are LOOKING at, so it has to
# appear where you are looking" -- see pickers.toml's own older comment on
# this panel for that reasoning in full). The user chose consistency (one
# fixed spot for every panel) over that per-panel follow-focus behavior.
screen         = "LG HDR WQHD"
# Hold this long before the panel is DRAWN -- a tap, or a hammered sequence,
# commits without it ever appearing. The user, 2026-09-21: "let's do 300ms",
# after being told the hammering fix was the reveal-key removal rather than
# the timing and that they might not want this at all. PER-PANEL on purpose:
# the default is 150 and cmd-tab keeps it, because 300ms of invisibility on
# the most-pressed key here would be a bad trade nobody asked for.
# Read where the timer is scheduled, so `paneld reload windows` is enough to
# change it -- unlike font_size/inset/line_height, which need a restart.
reveal_delay_ms = 300

[[panel]]
name    = "keybindings"
# A static keybindings reference, paged by `less` -- NOT a picker (see
# context/keybindings_view.py and pickers.toml's note). Summoned by
# space-? via `paneld toggle keybindings`, like files/config-files/apps --
# so this hotkey is never pressed and is set explicitly only to avoid the
# f18 default. f16/17/19/20 are already taken by switcher/apps/config-
# files/files; f21 failed to parse (HOTKEY NOT REGISTERED), f14 works.
hotkey  = "hyper-f14"
# render-keybindings-command prints the pane's whole pipeline: the
# renderer piped into `less -R --lesskey-src=keybindings.lesskey` (NOT
# `-k`/`--lesskey-file=` -- that flag wants a COMPILED lesskey file and
# rejected this plain-text one live, "Cannot use lesskey file"), then
# paneld's own PICKER_HIDE command -- so `less` exiting (q, or the
# lesskey-bound Esc) actually closes the panel, the same as a dismissed
# fzf picker.
compose = "context render-keybindings-command"
# FIXED, not content-driven -- the user's own ask: equal padding on all
# four sides of the SMALL monitor (Built-in Retina, 1440x900 logical,
# measured via hs.screen). For ANY margin M centred on that screen,
# width - height must equal 1440 - 900 = 540. First cut used M=150
# (1140x600); the user asked to size up a bit, so M=100: width=1240,
# height=700. Same absolute px on the big monitor (LG HDR WQHD,
# 3440x1440) by the user's own choice, margins uneven there.
width   = 1240
height  = 700
# PINNED TO THE LG, 2026-09-28 -- same reasoning as `files`/`config-files`
# above: no documented reason to be unpinned, it simply never got the
# line, per the user's request that every panel appear in a fixed place.
screen  = "LG HDR WQHD"
arm     = true

[[panel]]
name           = "chrome-tabs"
# PLAIN cmd-` (backtick) as of 2026-09-26 (the user's own request: cmd-tab,
# cmd-esc, cmd-backtick as workspace/window/chrome-tab, one modifier
# family), off control-cmd-tab -- freeing that chord entirely, nothing
# claims it now. Rewritten by karabiner.edn to cmd-f13, reusing the F13
# this panel used to reach via control-cmd-tab -- the same
# Carbon-registration reason cmd-tab is rewritten to cmd-f18 and
# option-cmd-` to cmd-opt-f15 (see the "workspace switcher" rule block in
# karabiner.edn). REPLACES the space-c toggle picker this panel started as
# (2026-09-25 morning) with a real hold/tap/release switcher (2026-09-25
# afternoon), matching `windows` exactly one tier down: `windows` cycles
# the focused WORKSPACE's windows, this cycles the focused Chrome
# WINDOW's tabs.
#
# NOT plain control-tab/backtick with no modifier, tried first (as
# control-tab) and reverted the same afternoon: this daemon's own
# release-to-commit monitor (Sources/paneld/PanelController.swift:474,532)
# is hardcoded to `NSEvent.modifierFlags.contains(.command)` -- ANY
# switcher-style panel (cycle = true) needs cmd physically held in its
# chord for that reason, not just this one. Confirmed live: plain
# control-tab committed instantly on install (panel never drawn), matching
# ~/.local/state/paneld/paneld.log's trace exactly. Generalizing this
# daemon to watch whichever modifier a panel's own hotkey declares,
# instead of hardcoding .command, is tracked as a real follow-up in this
# project -- not fixed here.
hotkey         = "cmd-f13"
hotkey_reverse = "cmd-shift-f13"
cycle          = true
# A bare `context`-style path isn't used here on purpose: this picker's
# producer/consumer live outside the context package entirely (see
# pickers.toml's own comment on the 2026-09-09 "this tool knows nothing
# about Chrome" decision).
compose = "context pick-command chrome-tabs"
width   = 912
height  = 420
# PINNED TO THE LG, 2026-09-28 -- the user's own explicit override, same
# reasoning as `windows` above (this panel matches its design one tier
# down: the focused Chrome window's tabs instead of the focused
# workspace's windows, so it inherited the same follow-focus choice,
# which the user chose to override for consistency instead).
screen  = "LG HDR WQHD"
arm     = true
# Same as `windows`: a tap-or-hammered-sequence commits before the panel
# is even drawn without this, and this is a newly-claimed chord with no
# hammering behavior observed yet. Reversible: `paneld reload chrome-tabs`
# after changing this number.
reveal_delay_ms = 300
# ON_EMPTY, 2026-09-28: a real macOS notification instead of an empty
# switcher panel when this workspace has no Chrome windows at all. Runs
# synchronously, bounded by paneld's own short timeout, right as the
